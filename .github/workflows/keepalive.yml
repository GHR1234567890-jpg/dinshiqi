name: Supabase Keepalive

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          echo "=== URL ==="
          echo "https://dscbqcqwxekijrhznqvz.supabase.co/rest/v1/rooms?select=id&limit=1"
          echo "=== KEY 长度 ==="
          echo -n "sb_publishable_esGiLQzvKS-vp3E2rLOwrg_OSg6yS6z" | wc -c
          echo "=== 请求 ==="
          curl -v "https://dscbqcqwxekijrhznqvz.supabase.co/rest/v1/rooms?select=id&limit=1" \
            -H "apikey: sb_publishable_esGiLQzvKS-vp3E2rLOwrg_OSg6yS6z" 2>&1 | tail -40
